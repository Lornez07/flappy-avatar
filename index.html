<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Avatar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300f0ff'/%3E%3Cstop offset='100%25' stop-color='%234488ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='%231a1a2e' stroke='url(%23g)' stroke-width='4'/%3E%3Ctext x='50' y='62' font-size='48' text-anchor='middle' fill='%23fff' font-family='serif'%3E😎%3C/text%3E%3C/svg%3E" />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        padding: 24px;
        background-color: #f3eddf;
        background-image: radial-gradient(circle, rgba(61, 51, 35, 0.11) 0.65px, transparent 0.8px);
        background-size: 7px 7px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash-card {
        display: flex; width: min(100%, 360px); flex-direction: column; align-items: center;
        padding: 38px 28px 30px;
        border: 2px solid #25231f; border-radius: 5px;
        background: #fffaf0; box-shadow: 7px 7px 0 #25231f;
        text-align: center;
      }
      #splash-kicker {
        display: flex; align-items: center; gap: 8px;
        color: #625e54; font: 900 10px "Trebuchet MS", Arial, sans-serif;
        letter-spacing: 0.16em; text-transform: uppercase;
      }
      #splash-kicker::before, #splash-kicker::after {
        width: 17px; height: 2px; background: #d84c3f; content: "";
      }
      #splash-icon {
        display: grid; width: 76px; height: 76px; place-items: center;
        margin-top: 22px; border: 2px solid #25231f; border-radius: 50%;
        background: #f2c84b; box-shadow: 3px 3px 0 #25231f;
        font-size: 43px; animation: bounce 0.8s ease-in-out infinite alternate;
      }
      #splash-title {
        margin-top: 24px; color: #25231f;
        font: 900 clamp(34px, 10vw, 46px)/0.9 Impact, "Arial Narrow", sans-serif;
        letter-spacing: -0.035em; text-transform: uppercase;
      }
      #splash-title span { color: #d84c3f; }
      #splash-sub {
        margin-top: 13px; color: #625e54;
        font: 11px "Trebuchet MS", Arial, sans-serif; letter-spacing: 0.04em;
      }
      #splash-loader {
        width: 100%; height: 5px; overflow: hidden;
        margin-top: 29px; border: 1px solid #25231f; border-radius: 5px;
        background: #f3eddf;
      }
      #splash-loader::after {
        display: block; width: 42%; height: 100%; border-radius: inherit;
        background: #d84c3f; content: ""; animation: load 1.1s ease-in-out infinite alternate;
      }
      @keyframes bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-7px) rotate(-5deg); }
      }
      @keyframes load {
        from { transform: translateX(0); }
        to { transform: translateX(136%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-icon, #splash-loader::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-card">
        <div id="splash-kicker">The one-button arcade</div>
        <div id="splash-icon" aria-hidden="true">😎</div>
        <div id="splash-title">Flappy <span>Avatar</span></div>
        <div id="splash-sub">Pick a face. Find your wings. Beat your best.</div>
        <div id="splash-loader" role="progressbar" aria-label="Loading"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
